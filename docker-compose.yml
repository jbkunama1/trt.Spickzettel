# Portainer: Stacks -> Add stack -> Repository (GitHub) oder Web editor
services:
  spickzettel:
    build: .
    container_name: spickzettel
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-bitte-aendern}
      SECRET_KEY: ${SECRET_KEY:-bitte-lang-und-zufaellig}
      # optional: lokales LLM (llama.cpp / OpenAI-kompatibel) zum Kuerzen
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-local}
    volumes:
      - spickzettel_data:/data
volumes:
  spickzettel_data:
